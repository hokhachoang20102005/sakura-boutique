{% extends 'base.html' %}
{% block title %}Đăng nhập — Sakura Boutique{% endblock %}

{% block content %}
<div class="auth-form">
    <div class="auth-header">
        <span class="auth-icon">&#127800;</span>
        <h2>Đăng nhập</h2>
        <p>Chào mừng trở lại Sakura Boutique</p>
    </div>
    <form method="POST">
        <div class="form-group">
            <label><i class="fas fa-user"></i> Tên đăng nhập</label>
            <input type="text" name="ten_dang_nhap" required placeholder="Nhập tên đăng nhập">
        </div>
        <div class="form-group">
            <label><i class="fas fa-lock"></i> Mật khẩu</label>
            <input type="password" name="mat_khau" required placeholder="Nhập mật khẩu">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Đăng nhập</button>
    </form>
    <p class="form-footer">Chưa có tài khoản? <a href="{{ url_for('dang_ky') }}">Đăng ký ngay</a></p>
</div>
{% endblock %}
