{% extends 'base.html' %}
{% block title %}Đăng ký — Sakura Boutique{% endblock %}

{% block content %}
<div class="auth-form">
    <div class="auth-header">
        <span class="auth-icon">&#127800;</span>
        <h2>Đăng ký tài khoản</h2>
        <p>Tạo tài khoản để mua sắm tại Sakura Boutique</p>
    </div>
    <form method="POST">
        <div class="form-group">
            <label><i class="fas fa-user"></i> Tên đăng nhập</label>
            <input type="text" name="ten_dang_nhap" required placeholder="Chọn tên đăng nhập">
        </div>
        <div class="form-group">
            <label><i class="fas fa-envelope"></i> Email</label>
            <input type="email" name="email" required placeholder="email@example.com">
        </div>
        <div class="form-group">
            <label><i class="fas fa-id-card"></i> Họ tên</label>
            <input type="text" name="ho_ten" required placeholder="Nhập họ tên đầy đủ">
        </div>
        <div class="form-group">
            <label><i class="fas fa-phone"></i> Số điện thoại</label>
            <input type="text" name="sdt" placeholder="Tuỳ chọn">
        </div>
        <div class="form-group">
            <label><i class="fas fa-lock"></i> Mật khẩu</label>
            <input type="password" name="mat_khau" required minlength="6" placeholder="Tối thiểu 6 ký tự">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Đăng ký</button>
    </form>
    <p class="form-footer">Đã có tài khoản? <a href="{{ url_for('dang_nhap') }}">Đăng nhập</a></p>
</div>
{% endblock %}
