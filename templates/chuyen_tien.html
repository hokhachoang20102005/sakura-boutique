{% extends 'base.html' %}
{% block title %}Chuyển tiền — Sakura Boutique{% endblock %}

{% block content %}
<div class="form-page">
    <h2><i class="fas fa-paper-plane"></i> Chuyển tiền</h2>
    <div class="balance-inline">
        <span>Số dư hiện tại:</span>
        <strong>{{ dinh_dang_tien(current_user.vi.so_du) }} VNĐ</strong>
    </div>
    <form method="POST">
        <div class="form-group">
            <label><i class="fas fa-user"></i> Tên đăng nhập người nhận</label>
            <input type="text" name="nguoi_nhan" required placeholder="Nhập tên đăng nhập">
        </div>
        <div class="form-group">
            <label><i class="fas fa-money-bill-wave"></i> Số tiền (VNĐ)</label>
            <input type="number" name="so_tien" required min="1000" step="1000" placeholder="VD: 100.000">
        </div>
        <div class="form-group">
            <label><i class="fas fa-comment"></i> Ghi chú</label>
            <input type="text" name="ghi_chu" placeholder="VD: Trả tiền cơm">
        </div>
        <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-paper-plane"></i> Chuyển tiền</button>
    </form>
</div>
{% endblock %}
